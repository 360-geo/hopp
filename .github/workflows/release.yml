name: "Build Hopp Release"

# 360Geo fork: Apple Silicon Macs only, signed with our own certificate (no Apple
# notarization), updates served from this repo's releases. Publish the draft
# release when it's done; the apps update from the latest published release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.0.33)"
        required: true
        type: string
      release_name:
        description: "Release name"
        required: false
        default: "Hopp Release"
        type: string
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      from_ref:
        description: "Previous release tag/SHA to diff from (auto-detected if empty)"
        required: false
        default: ""
        type: string

jobs:
  prepare-notes:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.collect.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve git-cliff args
        id: cliff_args
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.from_ref }}" ]]; then
            echo "args=--tag ${{ github.event.inputs.version }} --strip header ${{ github.event.inputs.from_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "args=--unreleased --tag ${{ github.event.inputs.version }} --strip header" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.cliff_args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: CHANGES.md

      - name: Expose notes as job output
        id: collect
        shell: bash
        run: |
          {
            echo "notes<<HOPP_EOF"
            cat "${{ steps.cliff.outputs.changelog }}"
            echo "HOPP_EOF"
          } >> "$GITHUB_OUTPUT"

  # Build for all platforms using matrix strategy
  build-release:
    needs: prepare-notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin --config src-tauri/tauri.conf.rel.json"
            target: "aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install Yarn
        run: corepack prepare yarn@stable --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Task (go-task)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install go-task/tap/go-task
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install go-task
          else
            # Linux
            sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          fi

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        shell: bash
        run: |
          yarn install

      - name: Map target to OS/ARCH for Task
        shell: bash
        id: task_vars
        run: |
          # Map from Rust target triple to task format
          case "${{ matrix.target }}" in
            "aarch64-apple-darwin")
              echo "task_os=mac" >> $GITHUB_OUTPUT
              echo "task_arch=arm64" >> $GITHUB_OUTPUT
              ;;
            "x86_64-apple-darwin")
              echo "task_os=mac" >> $GITHUB_OUTPUT
              echo "task_arch=x64" >> $GITHUB_OUTPUT
              ;;
            "x86_64-pc-windows-msvc")
              echo "task_os=win" >> $GITHUB_OUTPUT
              echo "task_arch=x64" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "task_os=linux" >> $GITHUB_OUTPUT
              echo "task_arch=x64" >> $GITHUB_OUTPUT
              ;;
          esac

      # Our self-signed certificate isn't trusted, so Tauri's own import (which
      # only accepts trusted identities) can't use it; codesign can.
      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          security find-identity -p codesigning build.keychain

      - name: Set app version from the release version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          version="${version#v}"
          jq --arg version "$version" '.version = $version' tauri/src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri/src-tauri/tauri.conf.json
          echo "App version: $version"

      - name: Run core:release task
        shell: bash
        run: |
          cd core
          task release OS=${{ steps.task_vars.outputs.task_os }} ARCH=${{ steps.task_vars.outputs.task_arch }}

      - name: Set Vite environment variables
        shell: bash
        id: vite_vars
        run: |
          # Set VITE_BOTTOM_ARROW based on platform (true for Windows, false for others)
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            echo "vite_bottom_arrow=true" >> $GITHUB_OUTPUT
            echo "vite_os=windows" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.target }}" == *"linux"* ]]; then
            echo "vite_bottom_arrow=false" >> $GITHUB_OUTPUT
            echo "vite_os=linux" >> $GITHUB_OUTPUT
          else
            echo "vite_bottom_arrow=false" >> $GITHUB_OUTPUT
            echo "vite_os=macos" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs with the certificate imported above. Without APPLE_ID it
          # skips notarization.
          APPLE_SIGNING_IDENTITY: "360Geo Hopp Code Signing"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_BOTTOM_ARROW: ${{ steps.vite_vars.outputs.vite_bottom_arrow }}
          VITE_OS: ${{ steps.vite_vars.outputs.vite_os }}
          SENTRY_DSN_RUST: ${{ secrets.SENTRY_DSN_RUST }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN_JS: ${{ secrets.VITE_SENTRY_DSN_JS }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        with:
          projectPath: tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.version }}
          releaseName: "${{ github.event.inputs.release_name }} ${{ github.event.inputs.version }}"
          releaseBody: ${{ needs.prepare-notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          updaterJsonKeepUniversal: false
